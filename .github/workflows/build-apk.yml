name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for f in jarvis-android-complete*.zip; do unzip -oq "$f"; done
      - name: Fix native module
        run: |
          cd jarvis/modules/jarvis-native
          sed -i '/useExpoPublishing/d' android/build.gradle
          printf '{"name":"jarvis-native","version":"0.1.0"}\n' > package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --legacy-peer-deps
        working-directory: jarvis
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: jarvis
      - name: Gradle build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: jarvis/android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/android/app/build/outputs/apk/release/*.apk
