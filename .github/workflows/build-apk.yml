name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for f in jarvis-android-complete*.zip; do unzip -oq "$f"; done
      - name: Move native module to a normal package
        working-directory: jarvis
        run: |
          mkdir -p packages
          mv modules/jarvis-native packages/jarvis-native
          sed -i '/useExpoPublishing/d' packages/jarvis-native/android/build.gradle
          printf '{"name":"jarvis-native","version":"0.1.0"}\n' > packages/jarvis-native/package.json
          ls -la packages/jarvis-native
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        working-directory: jarvis
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps ./packages/jarvis-native
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: jarvis
      - name: Debug modules
        working-directory: jarvis
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/al.json || true
          node -e "const j=require('/tmp/al.json');(j.modules||[]).forEach((m,i)=>console.log(i,m.packageName,JSON.stringify(m.projects&&m.projects[0]&&m.projects[0].publication)))" || true
      - name: Gradle build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: jarvis/android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/android/app/build/outputs/apk/release/*.apk
